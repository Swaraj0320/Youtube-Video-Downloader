services:
  - type: web
    name: tubeclip-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    numInstances: 1
    autoDeploy: false
    envVars:
      - key: TUBECLIP_ENV
        value: production
      # Required: exact frontend origins, comma-separated, without trailing paths.
      - key: ALLOWED_ORIGINS
        sync: false
      # RENDER_EXTERNAL_HOSTNAME is automatically allowed. Optional extra API hosts.
      - key: ALLOWED_HOSTS
        sync: false
      - key: FILE_RETENTION_SECONDS
        value: "900"
      - key: MAX_CONCURRENT_JOBS
        value: "1"
      - key: MAX_CONCURRENT_ANALYSES
        value: "1"
      - key: JOB_TIMEOUT_SECONDS
        value: "240"
      - key: MAX_MEDIA_DURATION_SECONDS
        value: "600"
      - key: MAX_CLIP_SECONDS
        value: "120"
      - key: MAX_SOURCE_MB
        value: "128"
      - key: MAX_OUTPUT_MB
        value: "128"
      - key: MAX_STORAGE_MB
        value: "384"
      - key: MIN_FREE_MB
        value: "256"
      - key: ANALYSIS_TTL_SECONDS
        value: "900"
      - key: JOB_TTL_SECONDS
        value: "1800"
      - key: RATE_LIMIT_REQUESTS_PER_MINUTE
        value: "300"
      - key: RATE_LIMIT_ANALYSES_PER_MINUTE
        value: "6"
      - key: RATE_LIMIT_DOWNLOADS_PER_MINUTE
        value: "3"
      - key: MAX_DOWNLOADS_PER_DAY
        value: "10"
